name: Probe API credentials
# Manual diagnostic: shows how GoDaddy and DataForSEO answer the runner. Prints status codes and
# the first lines of each reply only; GitHub masks secret values in logs.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
      GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      DATAFORSEO_AUTH: ${{ secrets.DATAFORSEO_AUTH }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: GoDaddy appraisal, no auth, default agent
        run: |
          curl -sS --max-time 20 -o body.txt -w "status=%{http_code}\n" "https://api.godaddy.com/v1/appraisal/example.com" || true
          head -c 300 body.txt; echo
      - name: GoDaddy appraisal, no auth, browser agent
        run: |
          curl -sS --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36" -H "Accept: application/json" -o body.txt -w "status=%{http_code}\n" "https://api.godaddy.com/v1/appraisal/example.com" || true
          head -c 300 body.txt; echo
      - name: GoDaddy appraisal, with key, browser agent
        run: |
          curl -sS --max-time 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36" -H "Accept: application/json" -H "Authorization: sso-key ${GODADDY_API_KEY}:${GODADDY_API_SECRET}" -o body.txt -w "status=%{http_code}\n" "https://api.godaddy.com/v1/appraisal/example.com" || true
          head -c 400 body.txt; echo
          echo "key length: ${#GODADDY_API_KEY}, secret length: ${#GODADDY_API_SECRET}"
      - name: GoDaddy domain availability, with key (is the key accepted anywhere?)
        run: |
          curl -sS --max-time 20 -A "Mozilla/5.0" -H "Accept: application/json" -H "Authorization: sso-key ${GODADDY_API_KEY}:${GODADDY_API_SECRET}" -o body.txt -w "status=%{http_code}\n" "https://api.godaddy.com/v1/domains/available?domain=example.com" || true
          head -c 400 body.txt; echo
      - name: GoDaddy OTE appraisal, with key
        run: |
          curl -sS --max-time 20 -A "Mozilla/5.0" -H "Accept: application/json" -H "Authorization: sso-key ${GODADDY_API_KEY}:${GODADDY_API_SECRET}" -o body.txt -w "status=%{http_code}\n" "https://api.ote-godaddy.com/v1/appraisal/example.com" || true
          head -c 400 body.txt; echo
      - name: DataForSEO account check (same credential handling as the runner)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, sys
          sys.path.insert(0, ".")
          from agents.domain_flipper import enrich
          try:
              header = enrich.basic_auth_header(os.environ.get("DATAFORSEO_LOGIN"), os.environ.get("DATAFORSEO_PASSWORD"), os.environ.get("DATAFORSEO_AUTH"))
          except Exception as exc:
              print("no usable DataForSEO credentials:", exc); raise SystemExit(0)
          pw = os.environ.get("DATAFORSEO_PASSWORD") or ""
          import base64
          print("password length", len(pw), "| login length", len(os.environ.get("DATAFORSEO_LOGIN") or ""))
          try:
              dec = base64.b64decode(pw, validate=True).decode("utf-8"); user = dec.split(":", 1)[0]
              print("password is valid base64:", True, "| decodes to user:pass:", ":" in dec, "| user is an email:", "@" in user, "| user equals DATAFORSEO_LOGIN:", user == (os.environ.get("DATAFORSEO_LOGIN") or "").strip())
          except Exception:
              print("password is valid base64:", False)
          print("treated as a token:", enrich._looks_like_basic_token(pw, os.environ.get("DATAFORSEO_LOGIN")) if pw else "n/a")
          req = urllib.request.Request("https://api.dataforseo.com/v3/appendix/user_data", headers={"Authorization": header})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r); print("status", r.status)
          except urllib.error.HTTPError as e:
              d = json.load(e); print("status", e.code)
          print("status_code", d.get("status_code"), d.get("status_message"))
          t = (d.get("tasks") or [{}])[0]; res = (t.get("result") or [{}])[0]
          print("balance", (res.get("money") or {}).get("balance"))
          PY
      - name: Humbleworth free valuation (alternative to GoDaddy)
        run: |
          curl -sS --max-time 20 -X POST -H "Content-Type: application/json" -H "Accept: application/json" -d '{"domains":["lumenpath.com","example.com"]}' -o body.txt -w "status=%{http_code}\n" "https://valuation.humbleworth.com/api/valuation" || true
          head -c 800 body.txt; echo
          curl -sS --max-time 20 -H "Accept: application/json" -o body.txt -w "status=%{http_code}\n" "https://valuation.humbleworth.com/api/valuation?domains=lumenpath.com" || true
          head -c 400 body.txt; echo
      - name: HumbleWorth on Replicate (needs REPLICATE_API_TOKEN)
        run: |
          if [ -z "$REPLICATE_API_TOKEN" ]; then echo "REPLICATE_API_TOKEN not set"; exit 0; fi
          echo "token length ${#REPLICATE_API_TOKEN} (Replicate tokens are 40 characters and start with r8_); starts with r8_: $([[ "$REPLICATE_API_TOKEN" == r8_* ]] && echo yes || echo no); contains spaces or dots: $([[ "$REPLICATE_API_TOKEN" == *[\ .]* ]] && echo yes || echo no)"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from agents.common.cache import Cache
          from agents.domain_flipper import diligence
          out = diligence.humbleworth_appraise(["lumenpath.com", "example.com"], os.environ["REPLICATE_API_TOKEN"], cache=Cache(":memory:"))
          for d, a in out.items():
              print(d, "->", a.get("status"), "| auction", a.get("auction"), "| marketplace", a.get("marketplace"), "| brokerage", a.get("brokerage"), "|", a.get("error", ""))
          PY
      - name: Replicate model lookup (which HumbleWorth model exists and its version)
        run: |
          if [ -z "$REPLICATE_API_TOKEN" ]; then echo "REPLICATE_API_TOKEN not set"; exit 0; fi
          for m in gregpriday/humbleworth-price humbleworth/price-predict-v1; do
            curl -sS --max-time 20 -H "Authorization: Bearer ${REPLICATE_API_TOKEN}" -o body.txt -w "$m status=%{http_code}\n" "https://api.replicate.com/v1/models/$m" || true
            python3 -c "import json; d=json.load(open('body.txt')); v=d.get('latest_version') or {}; print('  name', d.get('name'), '| owner', d.get('owner'), '| latest_version', v.get('id'), '| detail', d.get('detail')); s=(v.get('openapi_schema') or {}).get('components',{}).get('schemas',{}); print('  Input', json.dumps(s.get('Input'))[:500]); print('  Output', json.dumps(s.get('Output'))[:300])" || head -c 300 body.txt
          done
          curl -sS --max-time 20 -H "Authorization: Bearer ${REPLICATE_API_TOKEN}" -o body.txt -w "account status=%{http_code}\n" "https://api.replicate.com/v1/account" || true
          python3 -c "import json; d=json.load(open('body.txt')); print('  account', d.get('username'), d.get('type'), '| detail', d.get('detail'))" || head -c 200 body.txt
